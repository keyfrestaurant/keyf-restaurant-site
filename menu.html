  <style>
    :root {
      --cream:#f7f2eb; --soft:#f1ebe3; --card:#fffaf3;
      --ink:#1f1a17; --muted:#5a5a5a; --eye:#6c6258;
      --green:#5f7b6e; --gold:#c79a5c; --gold-d:#b98949;
      --tan:#c8b79f; --line:rgba(199,154,92,0.22); --dark:#1f1a17;
      --tbh:128px;
    }
    * { box-sizing:border-box; margin:0; padding:0; }
    html { scroll-behavior:smooth; }
    body { font-family:"Inter",sans-serif; color:var(--ink); background:var(--cream); line-height:1.6; }
    a { text-decoration:none; }

    /* ---- HEADER (site ile aynı, sabit değil) ---- */
    .site-header { background:var(--cream); border-bottom:1px solid rgba(0,0,0,0.06); }
    .header-inner { max-width:1240px; margin:0 auto; padding:16px 22px;
      display:flex; align-items:center; justify-content:space-between; gap:20px; }
    .logo { font-family:"Cormorant Garamond",serif; font-size:2.2rem; font-weight:600; color:var(--green); white-space:nowrap; }
    .main-nav { display:flex; align-items:center; gap:28px; flex-wrap:wrap; justify-content:center; }
    .main-nav a { color:#2b2926; font-size:1rem; font-weight:500; transition:color .25s ease; }
    .main-nav a:hover { color:var(--gold-d); }
    .lang-switch { display:flex; align-items:center; gap:8px; flex-shrink:0; }
    .lang-btn { display:inline-flex; align-items:center; justify-content:center;
      min-width:44px; height:38px; padding:0 12px; border-radius:10px;
      border:1px solid var(--tan); background:#fffaf3; color:#6a5641;
      font-size:.9rem; font-weight:700; transition:all .25s ease; }
    .lang-btn:hover { border-color:var(--gold-d); color:var(--gold-d); }
    .lang-btn.active { background:var(--gold); border-color:var(--gold); color:var(--ink); }

    /* ---- MENU HERO ---- */
    .menu-hero { text-align:center; padding:60px 20px 36px; background:var(--cream); }
    .menu-hero .eyebrow { display:inline-block; margin-bottom:12px; font-size:.82rem;
      letter-spacing:.2em; color:var(--eye); }
    .menu-hero h1 { font-family:"Cormorant Garamond",serif; font-weight:600;
      font-size:clamp(2.6rem,6vw,4rem); line-height:1.05; color:#111; margin-bottom:14px; }
    .menu-hero p { max-width:560px; margin:0 auto 22px; color:var(--muted); font-size:1.05rem; }
    .print-btn { display:inline-flex; align-items:center; gap:8px; padding:9px 20px;
      border-radius:10px; border:1px solid var(--tan); background:#fffaf3; color:#6a5641;
      font-size:.92rem; font-weight:600; cursor:pointer; transition:all .25s ease; }
    .print-btn:hover { border-color:var(--gold-d); color:var(--gold-d); }

    /* ---- STICKY TOOLBAR ---- */
    .toolbar { position:sticky; top:0; z-index:900;
      background:rgba(247,242,235,0.97); backdrop-filter:blur(10px);
      border-top:1px solid var(--line); border-bottom:1px solid var(--line); }
    .toolbar-inner { max-width:900px; margin:0 auto; padding:12px 18px; }
    .search-row { display:flex; gap:10px; align-items:center; }
    .search-box { position:relative; flex:1; }
    .search-box input { width:100%; height:42px; padding:0 38px 0 38px;
      border:1px solid var(--tan); border-radius:11px; background:#fffdf9;
      font-family:inherit; font-size:.98rem; color:var(--ink); }
    .search-box input:focus { outline:none; border-color:var(--gold); box-shadow:0 0 0 3px rgba(199,154,92,0.15); }
    .search-box .s-ico { position:absolute; left:13px; top:50%; transform:translateY(-50%);
      width:16px; height:16px; opacity:.5; pointer-events:none; }
    .search-box .s-clear { position:absolute; right:8px; top:50%; transform:translateY(-50%);
      width:26px; height:26px; border:none; background:none; cursor:pointer; color:var(--muted);
      font-size:1.1rem; display:none; border-radius:50%; }
    .search-box .s-clear:hover { background:rgba(0,0,0,.06); }
    .pills { display:flex; gap:8px; margin-top:10px; overflow-x:auto;
      scrollbar-width:none; -webkit-overflow-scrolling:touch; padding-bottom:2px; }
    .pills::-webkit-scrollbar { display:none; }
    .pill { white-space:nowrap; padding:7px 15px; border-radius:999px;
      border:1px solid var(--tan); background:#fffaf3; color:#6a5641;
      font-size:.9rem; font-weight:600; cursor:pointer; transition:all .2s ease; }
    .pill:hover { border-color:var(--gold-d); color:var(--gold-d); }
    .pill.active { background:var(--gold); border-color:var(--gold); color:var(--ink); }

    /* ---- CONTENT ---- */
    main { max-width:900px; margin:0 auto; padding:10px 18px 40px; }
    .menu-group { scroll-margin-top:var(--tbh); padding-top:34px; }
    .group-title { text-align:center; font-family:"Cormorant Garamond",serif;
      font-weight:600; font-size:clamp(1.9rem,4vw,2.6rem); color:var(--green);
      margin:8px 0 22px; position:relative; }
    .group-title span { background:var(--cream); padding:0 18px; position:relative; z-index:1; }
    .group-title::before { content:""; position:absolute; left:0; right:0; top:50%;
      height:1px; background:var(--line); }

    .menu-cat { background:var(--card); border:1px solid var(--line);
      border-radius:16px; padding:24px 26px; margin-bottom:18px; }
    .cat-title { font-family:"Cormorant Garamond",serif; font-weight:600;
      font-size:1.7rem; color:#2b2926; }
    .cat-title::after { content:""; display:block; width:46px; height:2px;
      background:var(--gold); margin-top:8px; }
    .cat-note { margin-top:10px; font-size:.92rem; color:var(--muted); font-style:italic; }

    .mi { padding:15px 0; border-bottom:1px solid rgba(0,0,0,0.055); }
    .mi:last-child { border-bottom:none; padding-bottom:2px; }
    .mi-top { display:flex; align-items:baseline; justify-content:space-between; gap:14px; }
    .mi-name { font-size:1.04rem; font-weight:500; color:var(--ink); }
    .mi-tag { display:inline-block; margin-left:8px; padding:2px 9px; border-radius:6px;
      background:rgba(199,154,92,0.16); color:#8a6a32; font-size:.72rem;
      font-weight:600; white-space:nowrap; vertical-align:1px; }
    .mi-price { font-family:"Cormorant Garamond",serif; font-weight:700;
      font-size:1.32rem; color:var(--gold-d); white-space:nowrap; }
    .mi-desc { margin-top:5px; font-size:.93rem; color:var(--muted); line-height:1.65;
      max-width:88%; }

    .no-results { display:none; text-align:center; padding:50px 20px;
      color:var(--muted); font-size:1.05rem; }

    /* ---- FOOTER (site ile aynı) ---- */
    footer { background:var(--dark); color:var(--tan); text-align:center;
      padding:40px 20px; font-size:.9rem; line-height:1.8; margin-top:20px; }
    footer .f-name { color:#f6e9d7; font-weight:700; }
    .footer-social { display:flex; justify-content:center; gap:20px; margin:16px 0; flex-wrap:wrap; }
    .footer-social a { color:var(--gold); font-size:.88rem; font-weight:500; transition:color .2s; }
    .footer-social a:hover { color:#f6e9d7; }
    .f-copy { margin-top:12px; font-size:.8rem; color:var(--eye); }

    /* ---- RESPONSIVE ---- */
    @media (max-width:1024px) {
      .header-inner { flex-wrap:wrap; justify-content:center; }
      .main-nav { order:3; width:100%; gap:18px; }
      .lang-switch { order:2; }
    }
    @media (max-width:768px) {
      .header-inner { padding:14px 16px; }
      .logo { font-size:1.8rem; }
      .main-nav { gap:14px; }
      .main-nav a { font-size:.95rem; }
      .menu-hero { padding:42px 18px 28px; }
      .menu-cat { padding:20px 18px; }
      .mi-desc { max-width:100%; }
      .mi-price { font-size:1.22rem; }
    }
    @media (max-width:480px) {
      .logo { font-size:1.55rem; }
      .mi-top { gap:10px; }
    }

    /* ---- PRINT ---- */
    @media print {
      .site-header, .toolbar, .print-btn, footer, .menu-hero p { display:none !important; }
      body { background:#fff; }
      .menu-hero { padding:0 0 10px; }
      main { max-width:100%; padding:0; }
      .menu-cat { border:1px solid #ddd; break-inside:avoid; box-shadow:none; }
      .menu-group { padding-top:14px; }
      .mi-price, .group-title { color:#000 !important; }
      .cat-title::after { background:#999; }
    }
  </style>
</head>

  <script src="menu-data.js"></script>
  <script>
  (function () {
    "use strict";

    var LANG = (new URLSearchParams(location.search).get("lang") === "en") ? "en" : "tr";

    var I18N = {
      tr: {
        title: "Menü | Key-f Restaurant & Cafe — Didim Marina",
        nav: { about:"Hakkımızda", why:"Neden Key-f?", menu:"Menü", reviews:"Yorumlar", contact:"İletişim" },
        eyebrow:"MENÜ", h1:"Lezzetlerimiz",
        intro:"Kahvaltıdan akşam yemeğine, Didim Marina'da özenle hazırlanan tüm tabaklarımız.",
        print:"Yazdır",
        searchPh:"Menüde ara… (ör. kalamar, burger)",
        noResults:"Aramanızla eşleşen bir kalem bulunamadı.",
        addr:"Didim Marina, Didim / Aydın, Türkiye",
        rights:"© 2025 Key-f Restaurant & Cafe. Tüm hakları saklıdır.",
        maps:"Google Haritalar"
      },
      en: {
        title: "Menu | Key-f Restaurant & Cafe — Didim Marina",
        nav: { about:"About", why:"Why Key-f?", menu:"Menu", reviews:"Reviews", contact:"Contact" },
        eyebrow:"MENU", h1:"Our Menu",
        intro:"All our dishes, from breakfast to dinner, prepared fresh at Didim Marina.",
        print:"Print",
        searchPh:"Search the menu… (e.g. calamari, burger)",
        noResults:"No items match your search.",
        addr:"Didim Marina, Didim / Aydın, Turkey",
        rights:"© 2025 Key-f Restaurant & Cafe. All rights reserved.",
        maps:"Google Maps"
      }
    };
    var T = I18N[LANG];
    var HOME = (LANG === "en") ? "en.html" : "index.html";

    function fmtPrice(n) { return "₺" + Number(n).toLocaleString("tr-TR"); }
    function el(tag, cls) { var e = document.createElement(tag); if (cls) e.className = cls; return e; }
    /* arama için Türkçe karakterleri sadeleştir: şğçıöü -> sgciou */
    function norm(s) {
      return (s || "").toLowerCase()
        .replace(/ş/g,"s").replace(/ğ/g,"g").replace(/ç/g,"c")
        .replace(/ı/g,"i").replace(/ö/g,"o").replace(/ü/g,"u")
        .replace(/â/g,"a").replace(/î/g,"i").replace(/û/g,"u");
    }

    /* ---- head / lang ---- */
    document.documentElement.lang = LANG;
    document.title = T.title;
    document.getElementById("logoLink").href = HOME;
    document.getElementById("langTr").classList.toggle("active", LANG === "tr");
    document.getElementById("langEn").classList.toggle("active", LANG === "en");

    /* ---- header nav ---- */
    var navWrap = document.getElementById("mainNav");
    [["about","about"],["why","why"],["menu","menu"],["reviews","social"],["contact","contact"]]
      .forEach(function (pair) {
        var a = document.createElement("a");
        a.textContent = T.nav[pair[0]];
        a.href = (pair[0] === "menu") ? "menu.html" + (LANG==="en"?"?lang=en":"") : HOME + "#" + pair[1];
        navWrap.appendChild(a);
      });

    /* ---- hero / static text ---- */
    document.getElementById("heroEyebrow").textContent = T.eyebrow;
    document.getElementById("heroTitle").textContent = T.h1;
    document.getElementById("heroIntro").textContent = T.intro;
    document.getElementById("printLabel").textContent = T.print;
    document.getElementById("printBtn").addEventListener("click", function () { window.print(); });
    var searchInput = document.getElementById("search");
    searchInput.placeholder = T.searchPh;
    document.getElementById("noResults").textContent = T.noResults;
    document.getElementById("fAddr").textContent = T.addr;
    document.getElementById("fCopy").textContent = T.rights;
    document.getElementById("fMaps").textContent = T.maps;

    /* ---- render menu ---- */
    var DATA = window.MENU;
    var catById = {};
    DATA.categories.forEach(function (c) { catById[c.id] = c; });

    var root = document.getElementById("menuRoot");
    var pillsWrap = document.getElementById("pills");
    var groupEls = [];

    DATA.groups.forEach(function (g) {
      var gSec = el("section", "menu-group");
      gSec.id = g.id;
      gSec.dataset.gid = g.id;

      var gt = el("div", "group-title");
      var gtSpan = el("span"); gtSpan.textContent = (LANG === "en") ? g.en : g.tr;
      gt.appendChild(gtSpan);
      gSec.appendChild(gt);

      g.cats.forEach(function (cid) {
        var cat = catById[cid];
        if (!cat) return;
        var card = el("div", "menu-cat");

        var h3 = el("h3", "cat-title");
        h3.textContent = (LANG === "en") ? cat.en : cat.tr;
        card.appendChild(h3);

        var note = (LANG === "en") ? cat.note_en : cat.note_tr;
        if (note) { var nd = el("div", "cat-note"); nd.textContent = note; card.appendChild(nd); }

        cat.items.forEach(function (it) {
          var mi = el("div", "mi");
          var name = (LANG === "en") ? it.en : it.tr;
          var desc = (LANG === "en") ? it.den : it.dtr;
          var tag  = (LANG === "en") ? it.tag_en : it.tag_tr;
          /* arama her iki dildeki isim+açıklamada da eşleşsin (Türkçe karakter duyarsız) */
          mi.dataset.search = norm(
            it.tr + " " + it.en + " " +
            (it.dtr || "") + " " + (it.den || "")
          );

          var top = el("div", "mi-top");
          var nameWrap = el("div");
          var ns = el("span", "mi-name"); ns.textContent = name; nameWrap.appendChild(ns);
          if (tag) { var ts = el("span", "mi-tag"); ts.textContent = tag; nameWrap.appendChild(ts); }
          var ps = el("span", "mi-price"); ps.textContent = fmtPrice(it.p);
          top.appendChild(nameWrap); top.appendChild(ps);
          mi.appendChild(top);

          if (desc) { var ds = el("p", "mi-desc"); ds.textContent = desc; mi.appendChild(ds); }
          card.appendChild(mi);
        });

        gSec.appendChild(card);
      });

      root.appendChild(gSec);
      groupEls.push(gSec);

      var pill = el("button", "pill");
      pill.textContent = (LANG === "en") ? g.en : g.tr;
      pill.dataset.target = g.id;
      pill.addEventListener("click", function () {
        document.getElementById(g.id).scrollIntoView({ behavior:"smooth", block:"start" });
      });
      pillsWrap.appendChild(pill);
    });

    /* ---- sticky toolbar height -> scroll offset ---- */
    var toolbar = document.querySelector(".toolbar");
    function syncToolbarHeight() {
      var h = toolbar.offsetHeight + 8;
      document.documentElement.style.setProperty("--tbh", h + "px");
      return h;
    }
    syncToolbarHeight();
    window.addEventListener("resize", syncToolbarHeight);

    /* ---- scroll-spy: highlight active group pill ---- */
    var pillByTarget = {};
    Array.prototype.forEach.call(pillsWrap.children, function (p) {
      pillByTarget[p.dataset.target] = p;
    });
    function setActivePill(id) {
      Array.prototype.forEach.call(pillsWrap.children, function (p) {
        p.classList.toggle("active", p.dataset.target === id);
      });
    }
    if (groupEls[0]) setActivePill(groupEls[0].dataset.gid);
    if ("IntersectionObserver" in window) {
      var spy = new IntersectionObserver(function (entries) {
        entries.forEach(function (e) {
          if (e.isIntersecting) setActivePill(e.target.dataset.gid);
        });
      }, { rootMargin: "-" + (toolbar.offsetHeight + 10) + "px 0px -62% 0px", threshold: 0 });
      groupEls.forEach(function (g) { spy.observe(g); });
    } else {
      /* eski tarayıcı: kaydırmaya göre basit aktiflik */
      window.addEventListener("scroll", function () {
        var y = window.pageYOffset + toolbar.offsetHeight + 20, cur = groupEls[0];
        groupEls.forEach(function (g) { if (g.offsetTop <= y) cur = g; });
        if (cur) setActivePill(cur.dataset.gid);
      }, { passive: true });
    }

    /* ---- search / filter ---- */
    var clearBtn = document.getElementById("searchClear");
    var noResults = document.getElementById("noResults");
    function runSearch() {
      var q = norm(searchInput.value.trim());
      clearBtn.style.display = searchInput.value.trim() ? "block" : "none";
      var anyVisible = false;
      groupEls.forEach(function (g) {
        var gHas = false;
        g.querySelectorAll(".menu-cat").forEach(function (card) {
          var cHas = false;
          card.querySelectorAll(".mi").forEach(function (mi) {
            var match = !q || mi.dataset.search.indexOf(q) !== -1;
            mi.style.display = match ? "" : "none";
            if (match) cHas = true;
          });
          card.style.display = cHas ? "" : "none";
          if (cHas) gHas = true;
        });
        g.style.display = gHas ? "" : "none";
        if (gHas) anyVisible = true;
      });
      noResults.style.display = anyVisible ? "none" : "block";
    }
    searchInput.addEventListener("input", runSearch);
    clearBtn.addEventListener("click", function () {
      searchInput.value = ""; runSearch(); searchInput.focus();
    });

    /* ---- JSON-LD: Menu schema (SEO) ---- */
    try {
      var sections = DATA.categories.map(function (c) {
        return {
          "@type": "MenuSection",
          "name": (LANG === "en") ? c.en : c.tr,
          "hasMenuItem": c.items.map(function (it) {
            var o = {
              "@type": "MenuItem",
              "name": (LANG === "en") ? it.en : it.tr,
              "offers": { "@type": "Offer", "price": it.p, "priceCurrency": "TRY" }
            };
            var d = (LANG === "en") ? it.den : it.dtr;
            if (d) o.description = d;
            return o;
          })
        };
      });
      var ld = document.createElement("script");
      ld.type = "application/ld+json";
      ld.textContent = JSON.stringify({
        "@context": "https://schema.org",
        "@type": "Menu",
        "name": "Key-f Restaurant & Cafe",
        "inLanguage": LANG,
        "hasMenuSection": sections
      });
      document.head.appendChild(ld);
    } catch (e) { /* schema isteğe bağlı, hata sayfayı etkilemez */ }

  })();
  </script>
</body>
